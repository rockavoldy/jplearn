<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        max-width: 420px;
        margin: 2rem auto;
        padding: 0 1rem;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1f2328;
      }
      h1 {
        font-size: 1.1rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: #6b7280;
        margin: 1rem 0 0.3rem;
      }
      input {
        width: 100%;
        padding: 0.55rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 0.95rem;
      }
      button {
        margin-top: 1rem;
        border: none;
        border-radius: 8px;
        background: #b91c1c;
        color: #fff;
        font-size: 0.9rem;
        padding: 0.55rem 1.2rem;
        cursor: pointer;
        font-weight: 600;
      }
      .saved {
        color: #15803d;
        font-size: 0.85rem;
        margin-left: 0.75rem;
      }
      .hint {
        font-size: 0.78rem;
        color: #6b7280;
        margin: 0.4rem 0 0;
      }
      code {
        background: #f3f4f6;
        padding: 0 0.25rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>JP Reader Settings</h1>
    <label for="apiBase">Backend API base URL</label>
    <input id="apiBase" type="url" placeholder="http://localhost:8080" />

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="Paste the API_KEY from your backend .env" />
    <p class="hint">
      Sent as the <code>X-API-Key</code> header when saving articles. Must match
      <code>API_KEY</code> on the backend.
    </p>

    <button id="save">Save</button>
    <span id="saved" class="saved"></span>
    <script src="options.js"></script>
  </body>
</html>

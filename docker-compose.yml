# Local development infrastructure only (Postgres + MinIO).
#
# The production stack lives in docker-compose.prod.yml (Postgres + backend
# image) and uses Cloudflare R2 instead of MinIO. The frontend is deployed to
# Cloudflare Pages and is not containerized.
services:
  postgres:
    image: postgres:16-alpine
    container_name: jplearn-postgres
    environment:
      POSTGRES_USER: jpl
      POSTGRES_PASSWORD: jpl
      POSTGRES_DB: jplearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jpl -d jplearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: jplearn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/jp-scrapper &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:

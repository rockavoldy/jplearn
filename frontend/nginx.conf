# nginx config for the JP Reader single-page application.
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip static text assets for faster loads.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # Vite emits content-hashed filenames under /assets, so they can be cached
    # immutably. The HTML entrypoint must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router uses history mode (createWebHistory), so unknown paths must
    # fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
